{% extends "auctions/layout.html" %}

{% block title %}
    BidVN - Đăng nhập
{% endblock %}

{% block body %}
    <div class="container py-3" style="max-width: 500px;">
        <h2>Đăng nhập</h2>
        
        {% if message %}
            <div class="alert alert-danger">{{ message }}</div>
        {% endif %}

        <form action="{% url 'login' %}" method="post">
            {% csrf_token %}
            <div class="form-group mb-3">
                <input class="form-control" autofocus type="text" name="username" placeholder="Tên đăng nhập">
            </div>
            <div class="form-group mb-3">
                <input class="form-control" type="password" name="password" placeholder="Mật khẩu">
            </div>
            <input class="btn btn-primary" type="submit" value="Đăng nhập">
        </form>

        <div class="mt-3">
            Chưa có tài khoản? <a href="{% url 'register' %}">Đăng ký tại đây.</a>
        </div>
    </div>
{% endblock %}
