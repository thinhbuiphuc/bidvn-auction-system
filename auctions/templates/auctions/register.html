{% extends "auctions/layout.html" %}

{% block title %}
    BidVN - Đăng ký
{% endblock %}

{% block body %}
    <div class="container py-3" style="max-width: 500px;">
        <h2>Đăng ký</h2>

        {% if message %}
            <div class="alert alert-danger">{{ message }}</div>
        {% endif %}

        <form action="{% url 'register' %}" method="post">
            {% csrf_token %}
            <div class="form-group mb-3">
                <input class="form-control" autofocus type="text" name="username" placeholder="Tên đăng nhập">
            </div>
            <div class="form-group mb-3">
                <input class="form-control" type="email" name="email" placeholder="Địa chỉ Email">
            </div>
            <div class="form-group mb-3">
                <input class="form-control" type="password" name="password" placeholder="Mật khẩu">
            </div>
            <div class="form-group mb-3">
                <input class="form-control" type="password" name="confirmation" placeholder="Xác nhận mật khẩu">
            </div>
            <input class="btn btn-primary" type="submit" value="Đăng ký">
        </form>

        <div class="mt-3">
            Đã có tài khoản? <a href="{% url 'login' %}">Đăng nhập tại đây.</a>
        </div>
    </div>
{% endblock %}
